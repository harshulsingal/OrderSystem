[project]
name = "ordersystem"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "psycopg2-binary>=2.9.12",
